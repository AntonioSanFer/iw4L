[package]
name = "perf"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Native Perfetto recording and generated typed instrumentation."

[features]
default = ["native"]
native = ["dep:perfetto-sdk"]

[dependencies]
diag.workspace = true
serde_json.workspace = true
uuid = { version = "1", features = ["v4"] }

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
perfetto-sdk = { version = "1", optional = true }

[lints]
workspace = true
