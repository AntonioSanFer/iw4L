[package]
name = "launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "The binary. Process entry only: allocator, argv, env, log init; assembly lives in bootstrap."

[[bin]]
name = "iw4l"
path = "src/main.rs"

[lib]
name = "iw4l"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
bevy-debug = ["bootstrap/bevy-debug"]
bevy-trace = ["bootstrap/bevy-trace"]

[dependencies]
updater = { path = "../updater" }
diag.workspace = true
asset_transport.workspace = true
bootstrap = { path = "../bootstrap" }

[target.'cfg(target_os = "android")'.dependencies]
bevy = { workspace = true, features = ["android-native-activity"] }

[lints]
workspace = true

[package.metadata.android]
package = "com.iw4l"
build_targets = ["aarch64-linux-android"]
# Debug info alone makes a ~1.9 GB APK.
strip = "strip"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 33

# cargo-apk builds the manifest from these keys; keep AndroidManifest.xml in step.
[package.metadata.android.application]
label = "iw4l"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|smallestScreenSize|density"
launch_mode = "singleTask"
orientation = "landscape"
exported = true

[[package.metadata.android.uses_feature]]
opengles_version = [3, 0]
required = true

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_NETWORK_STATE"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VIDEO"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

# Game trees are .ff/.iwd files, not media: "All files access" reads them.
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"
